name: Regression Gate

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  rag-regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TYPHOON_API_KEY: ${{ secrets.TYPHOON_API_KEY }}
      BASE_URL: http://127.0.0.1:8001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate and render architecture diagrams
        run: bash scripts/validate_arch_diagrams.sh --render

      - name: Upload architecture diagram renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-diagrams-svg
          path: docs/rendered/*.svg
          if-no-files-found: error

      - name: Install eval dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Start rag-service
        run: docker compose up -d rag-service

      - name: Wait for rag-service health
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if curl -fsS "${BASE_URL}/health" >/dev/null; then
              echo "rag-service is healthy"
              exit 0
            fi
            echo "waiting for rag-service... ($i/90)"
            sleep 5
          done
          echo "rag-service did not become healthy in time"
          docker compose logs rag-service || true
          exit 1

      - name: Run regression gate
        run: bash scripts/run_regression_gate.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-gate-reports
          path: reports/testqa_v2_live_eval_*
          if-no-files-found: warn

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs rag-service || true

      - name: Stop services
        if: always()
        run: docker compose down
