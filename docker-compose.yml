services:
  # RAG Service with Typhoon LLM integration
  rag-service:
    build:
      context: ./services/rag-service
      dockerfile: Dockerfile
    container_name: cpe-chat-rag
    ports:
      - "${RAG_PORT:-8001}:8001"
    environment:
      # Network configuration
      RAG_HOST: "0.0.0.0"
      RAG_PORT: "8001"
      
      # Data directories (mount points)
      DATA_DIR: /app/data
      CHROMA_DIR: /app/indexes/chroma
      SQLITE_PATH: /app/indexes/sqlite/ingestion.db
      CPE_INDEX_ROOT: /app/indexes
      RAG_ENGINE: "${RAG_ENGINE:-open_notebook_style}"
      RAG_VECTOR_BACKEND: "${RAG_VECTOR_BACKEND:-chroma}"
      RAG_CHROMA_COLLECTION: "${RAG_CHROMA_COLLECTION:-cpe_chat_sources}"
      RAG_CHROMA_DIR: "/app/indexes/global/chroma"
      RAG_GLOBAL_SQLITE_PATH: "/app/indexes/global/sqlite/ingestion.db"
      RAG_LEGACY_DOMAIN_INDEX_COMPAT: "${RAG_LEGACY_DOMAIN_INDEX_COMPAT:-0}"
      THAI_TOKENIZER_PROVIDER: "${THAI_TOKENIZER_PROVIDER:-pythainlp}"
      THAI_TOKENIZER_ENGINE: "${THAI_TOKENIZER_ENGINE:-newmm}"
      
      # Embedding configuration
      EMBEDDING_MODEL: "BAAI/bge-m3"
      EMBEDDING_DIM: "1024"
      TOKEN_BUDGET: "${TOKEN_BUDGET:-2400}"
      MAX_CONTEXTS: "${MAX_CONTEXTS:-8}"
      RAG_CURRICULUM_BYPASS_VECTOR: "${RAG_CURRICULUM_BYPASS_VECTOR:-0}"
      
      # LLM Configuration - gemma primary with Typhoon fallback for answers
      LLM_ENABLE: "1"
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      LLM_MODEL: "${LLM_MODEL:-gemma4:26b}"
      LLM_AUX_PROVIDER: "${LLM_AUX_PROVIDER:-typhoon}"
      LLM_AUX_MODEL: "${LLM_AUX_MODEL:-typhoon-v2.5-30b-a3b-instruct}"
      LLM_AUX_FOR_REWRITE: "${LLM_AUX_FOR_REWRITE:-0}"
      LLM_AUX_FOR_MULTIQUERY: "${LLM_AUX_FOR_MULTIQUERY:-0}"
      LLM_AUX_FOR_ROUTING: "${LLM_AUX_FOR_ROUTING:-0}"
      LLM_AUX_FALLBACK_FOR_ANSWER: "${LLM_AUX_FALLBACK_FOR_ANSWER:-1}"
      LLM_MAX_TOKENS: "${LLM_MAX_TOKENS:-512}"
      LLM_TEMPERATURE: "0.4"
      
      # Typhoon API Configuration
      TYPHOON_API_KEY: "${TYPHOON_API_KEY}"
      TYPHOON_BASE_URL: "${TYPHOON_BASE_URL:-https://api.opentyphoon.ai/v1}"
      TYPHOON_TIMEOUT_S: "60"

      # Ollama API Configuration
      OLLAMA_API_KEY: "${OLLAMA_API_KEY:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_TIMEOUT_S: "${OLLAMA_TIMEOUT_S:-120}"
      OLLAMA_THINK: "${OLLAMA_THINK:-0}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-30m}"
      OLLAMA_FIRST_TOKEN_TIMEOUT_S: "${OLLAMA_FIRST_TOKEN_TIMEOUT_S:-10}"
      OLLAMA_OVERALL_TIMEOUT_S: "${OLLAMA_OVERALL_TIMEOUT_S:-120}"
      
      # CORS Configuration for OpenWeb-UI
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080,${OPENWEB_UI_URL:-http://localhost:3000}"

      # Debug endpoints (disabled by default)
      RAG_EXPOSE_CONFIG: "${RAG_EXPOSE_CONFIG:-0}"

      # Timing logs (optional): helps diagnose latency (retrieval vs LLM)
      RAG_TIMING: "${RAG_TIMING:-0}"
      RAG_TIMING_MIN_MS: "${RAG_TIMING_MIN_MS:-0}"
      RAG_WORKERS: "${RAG_WORKERS:-1}"
      RAG_RETRIEVAL_CACHE_ENABLE: "${RAG_RETRIEVAL_CACHE_ENABLE:-0}"

      # Shared follow-up memory for multi-worker / multi-instance deployment.
      RAG_SESSION_REDIS_URL: "${RAG_SESSION_REDIS_URL:-redis://redis:6379/0}"
      RAG_SESSION_TTL_SECONDS: "${RAG_SESSION_TTL_SECONDS:-3600}"

      # LangChain orchestration defaults.
      RAG_USE_LANGCHAIN: "${RAG_USE_LANGCHAIN:-1}"
      RAG_RESPONSE_PROFILE: "${RAG_RESPONSE_PROFILE:-fast}"
      RAG_FAST_MAX_CONTEXTS: "${RAG_FAST_MAX_CONTEXTS:-8}"
      RAG_LC_MULTIQUERY: "${RAG_LC_MULTIQUERY:-1}"
      RAG_LC_MULTIQUERY_N: "${RAG_LC_MULTIQUERY_N:-4}"
      RAG_LC_MULTIQUERY_ALL: "${RAG_LC_MULTIQUERY_ALL:-0}"
      RAG_LC_PARALLEL: "${RAG_LC_PARALLEL:-1}"
      RAG_LC_PARALLEL_WORKERS: "${RAG_LC_PARALLEL_WORKERS:-4}"
      RAG_LC_RERANK: "${RAG_LC_RERANK:-1}"
      RAG_LC_RERANK_TOPN: "${RAG_LC_RERANK_TOPN:-24}"
      RAG_LC_RERANK_ALL: "${RAG_LC_RERANK_ALL:-1}"
      RAG_LC_COMPRESS: "${RAG_LC_COMPRESS:-1}"
      RAG_LC_COMPRESS_MAX_CHARS: "${RAG_LC_COMPRESS_MAX_CHARS:-700}"
      RAG_LC_COMPRESS_ALL: "${RAG_LC_COMPRESS_ALL:-1}"
      RAG_LC_ROUTE_LLM: "${RAG_LC_ROUTE_LLM:-0}"
      RAG_LC_STRUCTURED: "${RAG_LC_STRUCTURED:-0}"
      RAG_LC_ENFORCE_CITATIONS: "${RAG_LC_ENFORCE_CITATIONS:-1}"

      # Search breadth (LangChain pipeline)
      # 1 = search all domains even when a domain is inferred (more accurate, slower)
      # 0 = search only inferred domain (faster)
      RAG_SEARCH_ALL_DOMAINS: "${RAG_SEARCH_ALL_DOMAINS:-1}"

      # Retrieval mode (built-in hybrid retrieval)
      # 1 = vector-only, 0 = hybrid (vector + keyword)
      RAG_VECTOR_ONLY: "${RAG_VECTOR_ONLY:-0}"

      # Retrieval parallelism (built-in hybrid retrieval)
      RAG_RETRIEVAL_PARALLEL: "${RAG_RETRIEVAL_PARALLEL:-1}"
      RAG_RETRIEVAL_PARALLEL_WORKERS: "${RAG_RETRIEVAL_PARALLEL_WORKERS:-2}"

      # Retrieval debugging and tuning
      RAG_DEBUG_RETRIEVAL: "${RAG_DEBUG_RETRIEVAL:-0}"
      RAG_HYBRID_SEMANTIC_WEIGHT: "${RAG_HYBRID_SEMANTIC_WEIGHT:-1.0}"
      RAG_HYBRID_KEYWORD_WEIGHT: "${RAG_HYBRID_KEYWORD_WEIGHT:-1.2}"
      RAG_DOMAIN_PRIOR_BONUS: "${RAG_DOMAIN_PRIOR_BONUS:-0.15}"
      RAG_ANCHOR_HIT_BONUS: "${RAG_ANCHOR_HIT_BONUS:-0.18}"
      RAG_MAX_PER_SOURCE: "${RAG_MAX_PER_SOURCE:-2}"

      # Multi-document retrieval mode (multi-hop / multi-source)
      # auto = enable only for multi-clause questions, on = force for all, off = disable
      RAG_MULTI_DOC_MODE: "${RAG_MULTI_DOC_MODE:-auto}"
      # Add extra answer-guidance when contexts are grouped by source
      RAG_MULTI_DOC_HINTS: "${RAG_MULTI_DOC_HINTS:-1}"
      # Limits/tuning
      RAG_MULTI_DOC_MAX_SUBQS: "${RAG_MULTI_DOC_MAX_SUBQS:-3}"
      RAG_MULTI_DOC_FINAL_LIMIT: "${RAG_MULTI_DOC_FINAL_LIMIT:-8}"
      RAG_MULTI_DOC_MAX_PER_SOURCE: "${RAG_MULTI_DOC_MAX_PER_SOURCE:-2}"
      RAG_MULTI_DOC_MIN_SOURCES: "${RAG_MULTI_DOC_MIN_SOURCES:-2}"
      RAG_MULTI_DOC_WIDE_LIMIT: "${RAG_MULTI_DOC_WIDE_LIMIT:-24}"
      RAG_MULTI_DOC_PER_DOMAIN_LIMIT: "${RAG_MULTI_DOC_PER_DOMAIN_LIMIT:-18}"
      RAG_MULTI_DOC_DOC_TOPN: "${RAG_MULTI_DOC_DOC_TOPN:-6}"
      RAG_MULTI_DOC_CHUNKS_PER_DOC: "${RAG_MULTI_DOC_CHUNKS_PER_DOC:-3}"

      # Optional Neo4j (Graph RAG) configuration
      # If not set, Graph features will gracefully fall back to non-graph retrieval.
      NEO4J_URI: "${NEO4J_URI:-}"
      NEO4J_USERNAME: "${NEO4J_USERNAME:-}"
      NEO4J_USER: "${NEO4J_USER:-}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-}"
      NEO4J_VECTOR_DIM: "1024"
      
      # Python configuration
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

      # MLflow (optional experiment tracking)
      MLFLOW_TRACKING_URI: "${MLFLOW_TRACKING_URI:-http://mlflow:5000}"

      # MLflow Observability (enabled by default)
      MLFLOW_OBSERVABILITY_ENABLE: "${MLFLOW_OBSERVABILITY_ENABLE:-1}"
      MLFLOW_OBSERVABILITY_EXPERIMENT: "${MLFLOW_OBSERVABILITY_EXPERIMENT:-cpe-chat-online-observability}"
      MLFLOW_OBS_FLUSH_S: "${MLFLOW_OBS_FLUSH_S:-10}"
      MLFLOW_OBS_WINDOW_N: "${MLFLOW_OBS_WINDOW_N:-500}"

      # MLflow per-request logging (log every incoming question as JSONL artifact)
      MLFLOW_OBS_REQUEST_LOG_ENABLE: "${MLFLOW_OBS_REQUEST_LOG_ENABLE:-1}"
      # Store question + answer + ctx_sources by default
      MLFLOW_OBS_REQUEST_LOG_CONTENT: "${MLFLOW_OBS_REQUEST_LOG_CONTENT:-1}"
      MLFLOW_OBS_REQUEST_LOG_MAX_CHARS: "${MLFLOW_OBS_REQUEST_LOG_MAX_CHARS:-2000}"
      MLFLOW_OBS_REQUEST_LOG_DIR: "${MLFLOW_OBS_REQUEST_LOG_DIR:-requests}"

      # MLflow Tracing (enabled by default with sampling)
      MLFLOW_TRACING_ENABLE: "${MLFLOW_TRACING_ENABLE:-1}"
      MLFLOW_TRACE_SAMPLE_RATE: "${MLFLOW_TRACE_SAMPLE_RATE:-1}"
      MLFLOW_TRACE_CONTENT: "${MLFLOW_TRACE_CONTENT:-1}"
      MLFLOW_TRACE_MAX_CHARS: "${MLFLOW_TRACE_MAX_CHARS:-1200}"
    
    volumes:
      # Mount indexed data from host
      - ./indexes:/app/indexes
      - ./data:/app/data
      - ./chroma:/app/chroma
    
    networks:
      - cpe-network

    depends_on:
      redis:
        condition: service_started
    
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8001/health').read(); sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
    
    # For debugging (remove in production)
    # stdin_open: true
    # tty: true

  # OpenWeb-UI - Web interface for LLM interaction with RAG
  openweb-ui:
    image: ghcr.io/open-webui/open-webui:${OPENWEB_UI_TAG:-latest}
    container_name: cpe-chat-openweb-ui
    ports:
      - "${OPENWEB_UI_PORT:-3000}:8080"
    environment:
      # OpenWeb-UI configuration
      # RAG service exposes an OpenAI-compatible API under /v1
      OPENAI_API_BASE_URL: "http://rag-service:8001/v1"
      
      # Enable authentication (optional)
      # WEBUI_AUTH_TOKEN: "${OPENWEB_UI_AUTH:-}"
      
      # Default model to use (matches RAG service primary model)
      OPENAI_API_KEY: "not-required"
    
    volumes:
      # Persistent storage for OpenWeb-UI
      - openweb-ui-data:/app/backend/data
    
    networks:
      - cpe-network
    
    depends_on:
      rag-service:
        condition: service_healthy
    
    restart: unless-stopped
    
    # For debugging (remove in production)
    # stdin_open: true
    # tty: true

  # MLflow - Experiment tracking UI/API
  mlflow:
    build:
      context: ./services/mlflow
      dockerfile: Dockerfile
    container_name: cpe-chat-mlflow
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    networks:
      - cpe-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cpe-chat-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - cpe-network
    restart: unless-stopped

networks:
  cpe-network:
    driver: bridge

volumes:
  openweb-ui-data:
    driver: local

  mlflow-data:
    driver: local

  redis-data:
    driver: local
